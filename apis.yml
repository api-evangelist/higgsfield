apis:
- name: Higgsfield API
  description: >-
    Asynchronous generative-media API. Submit a generation request to any of the
    100+ model endpoints (POST /{model_id}), then retrieve status
    (GET /requests/{request_id}/status), cancel a queued request
    (POST /requests/{request_id}/cancel), or receive a webhook when the request
    reaches a final status (completed, failed, nsfw). Authenticated with an API
    key + secret via the "Authorization: Key {key}:{secret}" scheme.
  humanURL: https://docs.higgsfield.ai/docs
