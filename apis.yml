aid: higgsfield
name: Higgsfield
description: >-
  Higgsfield is a multi-model generative AI platform for video, image, editing,
  storyboarding, and commercial content creation. Its public developer API
  (platform.higgsfield.ai) exposes 100+ generative models — Sora 2, Veo 3.1,
  Kling, Seedance, Hailuo, FLUX, Nano Banana, Reve, and Higgsfield's own Soul /
  DoP / Popcorn models — behind a single asynchronous request/response contract:
  POST a model endpoint to enqueue a generation, then poll the request status or
  receive a webhook when it completes. The platform ships an official Python SDK
  (higgsfield-client), a Node.js/TypeScript SDK (@higgsfield/client), a
  cross-platform CLI (@higgsfield/cli), a remote MCP server (mcp.higgsfield.ai)
  for agent access, and a public set of Agent Skills for Claude, Cursor, and
  Codex. Backed by Accel and Menlo Ventures.
