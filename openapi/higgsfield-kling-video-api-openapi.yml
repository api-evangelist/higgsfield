openapi: 3.2.0
info:
  title: Higgsfield Kling Video API
  version: 2.0.0
  description: Submit generation requests and retrieve their status and outputs.
servers:
- url: https://api.higgsfield.ai
security:
- authKey: []
tags:
- name: Kling Video
paths:
  /kling-video/v2.5-turbo/pro/image-to-video:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  title: Prompt
                duration:
                  enum:
                  - 5
                  - 10
                  type: integer
                  title: Duration
                  default: 5
                cfg_scale:
                  type: number
                  title: CFG Scale
                  default: 0.5
                  maximum: 1
                  minimum: 0
                  multipleOf: 0.01
                image_url:
                  type: string
                  title: Image URL
                  format: uri
                negative_prompt:
                  type: string
                  title: Negative Prompt
                  default: ''
              required:
              - prompt
              - image_url
      responses:
        '200':
          description: The request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
      operationId: post_kling_video_v2_5_turbo_pro_image_to_video
      summary: Create kling-video v2.5-turbo pro image-to-video
      tags:
      - Kling Video
      description: Submit an asynchronous generation request to `/kling-video/v2.5-turbo/pro/image-to-video`. The response includes request metadata for status tracking and cancellation.
  /kling-video/v2.5-turbo/pro/text-to-video:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  title: Prompt
                duration:
                  enum:
                  - 5
                  - 10
                  type: integer
                  title: Duration
                  default: 5
                cfg_scale:
                  type: number
                  title: CFG Scale
                  default: 0.5
                  maximum: 1
                  minimum: 0
                  multipleOf: 0.01
                negative_prompt:
                  type: string
                  title: Negative Prompt
                  default: ''
              required:
              - prompt
      responses:
        '200':
          description: The request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
      operationId: post_kling_video_v2_5_turbo_pro_text_to_video
      summary: Create kling-video v2.5-turbo pro text-to-video
      tags:
      - Kling Video
      description: Submit an asynchronous generation request to `/kling-video/v2.5-turbo/pro/text-to-video`. The response includes request metadata for status tracking and cancellation.
  /kling-video/v2.5-turbo/standard/image-to-video:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  title: Prompt
                duration:
                  enum:
                  - 5
                  - 10
                  type: integer
                  title: Duration
                  default: 5
                cfg_scale:
                  type: number
                  title: CFG Scale
                  default: 0.5
                  maximum: 1
                  minimum: 0
                  multipleOf: 0.01
                image_url:
                  type: string
                  title: Image URL
                  format: uri
                negative_prompt:
                  type: string
                  title: Negative Prompt
                  default: ''
              required:
              - prompt
              - image_url
      responses:
        '200':
          description: The request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
      operationId: post_kling_video_v2_5_turbo_standard_image_to_video
      summary: Create kling-video v2.5-turbo standard image-to-video
      tags:
      - Kling Video
      description: Submit an asynchronous generation request to `/kling-video/v2.5-turbo/standard/image-to-video`. The response includes request metadata for status tracking and cancellation.
components:
  schemas:
    RequestStatus:
      title: Request
      type: object
      properties:
        status:
          enum:
          - queued
          - in_progress
          - nsfw
          - failed
          - completed
          - canceled
          title: Status
          type: string
        request_id:
          type: string
          format: uuid
        status_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri
        error:
          type:
          - string
          - 'null'
        images:
          type: array
          items:
            $ref: '#/components/schemas/MediaOutput'
        video:
          $ref: '#/components/schemas/MediaOutput'
        audio:
          $ref: '#/components/schemas/MediaOutput'
        audios:
          type: array
          items:
            $ref: '#/components/schemas/MediaOutput'
      required:
      - status
      - request_id
    MediaOutput:
      title: Media output
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
      required:
      - url
  securitySchemes:
    authKey:
      type: apiKey
      in: header
      name: Authorization
      description: Use `Key {api_key_id}:{api_key_secret}`.
x-mcp:
  enabled: true
x-provenance:
  method: harvested
  publisher: Higgsfield
  source: https://docs.higgsfield.ai/docs/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
